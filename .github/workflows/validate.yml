name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate HTML
        run: |
          find . -name '*.html' -not -path './s4/*' -print0 | while IFS= read -r -d '' f; do
            echo "== $f"
            node s4/contract/validate-s4.mjs "$f"
          done
